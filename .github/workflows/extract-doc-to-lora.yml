name: Extract Doc-to-LoRA figures

on:
  push:
    paths:
      - ".github/workflows/extract-doc-to-lora.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Download original research paper
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" "https://arxiv.org/pdf/2602.15902v1" -o paper.pdf || \
          curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" "https://export.arxiv.org/pdf/2602.15902v1" -o paper.pdf
          python -c "import fitz; d=fitz.open('paper.pdf'); assert len(d)==28, f'Unexpected PDF page count: {len(d)}'"
      - name: Extract precise vector and high-resolution raster figures
        shell: bash
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path

          paper = fitz.open("paper.pdf")
          output = Path("Doc-to-LoRA")
          output.mkdir(exist_ok=True)

          # 1-indexed source page, followed by exact rectangle (x0, y0, x1, y1) in PDF points.
          # Verified by pixel-perfect template matching against the previously cropped PDF figures.
          figures = {
              1: (2, 54, 62, 542, 242),
              2: (4, 307, 60, 541, 364),
              3: (6, 54, 57, 543, 246),
              4: (7, 54, 160, 542, 318),
              5: (13, 54, 220, 543, 423),
              6: (14, 131, 309, 464, 415),
              7: (16, 54, 60, 543, 432),
              8: (17, 54, 59, 543, 736),
              9: (18, 126, 62, 482, 273),
              10: (20, 54, 125, 543, 625),
              11: (21, 54, 294, 543, 457),
              12: (22, 54, 124, 543, 628),
              13: (23, 54, 294, 543, 457),
          }

          for number, (page_number, *coords) in figures.items():
              page = paper[page_number - 1]
              rectangle = fitz.Rect(*coords)
              basename = output / f"Figure_{number:02d}"
              # 4x 72dpi = 288dpi; redraw directly from the original PDF.
              page.get_pixmap(matrix=fitz.Matrix(4, 4), clip=rectangle,
                              alpha=False).save(str(basename) + ".png")
              # Preserve original vector paths/text; do not rasterize to PDF.
              newdoc = fitz.open()
              dest = newdoc.new_page(width=rectangle.width, height=rectangle.height)
              dest.show_pdf_page(dest.rect, paper, page_number - 1,
                                 clip=rectangle, keep_proportion=False)
              newdoc.save(str(basename) + ".pdf", garbage=4, deflate=True)
              newdoc.close()
              print(f"Figure {number:02d}: PDF page {page_number}; {rectangle}")
          PY
      - name: Commit extracted figures to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Doc-to-LoRA/*.png Doc-to-LoRA/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add 13 high-resolution Doc-to-LoRA figures (PNG and vector PDF)"
            git push
          fi
