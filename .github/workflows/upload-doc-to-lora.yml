name: Upload Doc-to-LoRA figures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upload-doc-to-lora.yml'

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Download exact arXiv v1 PDF
        run: |
          curl -fSL --retry 5 --retry-all-errors --retry-delay 3 \
            --user-agent 'Mozilla/5.0 (compatible; academic-figure-extractor)' \
            -o /tmp/doc-to-lora-v1.pdf \
            'https://arxiv.org/pdf/2602.15902v1'
          python - <<'PY'
          import fitz
          p=fitz.open('/tmp/doc-to-lora-v1.pdf')
          print(f"Downloaded paper: {len(p)} pages")
          assert len(p) == 28, "Expected exact 28-page arXiv v1"
          PY
      - name: Extract all figures as 288-DPI PNG and vector PDF
        run: python scripts/extract_doc_to_lora.py /tmp/doc-to-lora-v1.pdf --output Doc-to-LoRA
      - name: Commit figures to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Doc-to-LoRA/
          if git diff --cached --quiet; then
            echo 'Figures already committed'
            exit 0
          fi
          git commit -m 'Add 13 Doc-to-LoRA figures in high-resolution PNG and vector PDF'
          git push
